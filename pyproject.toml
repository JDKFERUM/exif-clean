[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exif-clean"
version = "0.1.0"
description = "Remove EXIF and XMP metadata from JPEG files before sharing them"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JDKFERUM" }]
keywords = ["privacy", "exif", "jpeg", "metadata", "gps"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
exif-clean = "exif_clean.cli:entry"

[project.urls]
Source = "https://github.com/JDKFERUM/exif-clean"

[tool.setuptools.packages.find]
include = ["exif_clean*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
